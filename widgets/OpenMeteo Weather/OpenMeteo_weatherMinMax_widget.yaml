component: f7-card
config:
  class:
    - padding
  style:
    text-align: center
slots:
  default:
    - component: f7-row
      config:
        visible: '=props.show_current_temp'
        style:
          margin-bottom: 15px
      slots:
        default:
          - component: Label
            config:
              text: '="Aktuell: " + (items[props.current_temp].displayState || "–")'
              style:
                font-size: 16px
                font-weight: 500
                width: 100%
                white-space: nowrap
    - component: f7-row
      slots:
        default:
          - component: f7-col
            slots:
              default:
                - component: Label
                  config:
                    text: Heute
                    style: {font-weight: bold}
                - component: oh-icon
                  config:
                    icon: '="f7:" + items[props.wmo_today].displayState'
                    width: 50
                - component: Label
                  config:
                    style: {fontSize: 12px, white-space: nowrap}
                    text: '=(items[props.temp_min_today].displayState || "–") + " | " + (items[props.temp_max_today].displayState || "–")'
          - component: f7-col
            slots:
              default:
                - component: Label
                  config:
                    text: '=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][dayjs().add(1,"day").day()]'
                    style: {font-weight: bold}
                - component: oh-icon
                  config:
                    icon: '="f7:" + items[props.wmo_tomorrow].displayState'
                    width: 50
                - component: Label
                  config:
                    style: {fontSize: 12px, white-space: nowrap}
                    text: '=(items[props.temp_min_tomorrow].displayState || "–") + " | " + (items[props.temp_max_tomorrow].displayState || "–")'
          - component: f7-col
